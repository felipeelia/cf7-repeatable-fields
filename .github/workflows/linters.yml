name: Code Linters

env:
  NODE_VERSION: "24"

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: "Install node v${{ env.NODE_VERSION }}"
              uses: actions/setup-node@v7.1.0
              with:
                node-version: ${{ env.NODE_VERSION }}

            - name: npm ci
              run: npm ci

            - name: ES lint
              run: npm run lint:js

            - name: Set PHP version
              uses: shivammathur/setup-php@2.40.0
              with:
                php-version: '8.3'
                tools: cs2pr
                coverage: none

            - name: composer install
              run: composer install

            - name: PHPCS check
              run: './vendor/bin/phpcs . -q --report=checkstyle --runtime-set testVersion 8.3- | cs2pr'
