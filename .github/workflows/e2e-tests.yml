name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [trunk]
  pull_request:
    branches:
      - trunk
      - '[0-9].[0-9x]*'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    name: Pinned versions
    uses: ./.github/workflows/e2e-tests-run.yml
